name: Ember Perception + Evidence Chain

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  perceive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install deps
        run: pip install rich cryptography
      
      - name: Seed databases
        run: |
          mkdir -p evidence
          python3 << 'PYEOF'
          import json
          import os
          from datetime import datetime
          
          # Seed provenance.db with sample data
          import sqlite3
          conn = sqlite3.connect("provenance.db")
          c = conn.cursor()
          c.execute("""
              CREATE TABLE IF NOT EXISTS actions (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  action_type TEXT,
                  command TEXT,
                  source TEXT,
                  content_hash TEXT,
                  approved_by TEXT,
                  approved_at TIMESTAMP,
                  executed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                  status TEXT DEFAULT 'pending',
                  notes TEXT
              )
          """)
          c.execute("INSERT INTO actions (action_type, command, source, status) VALUES (?, ?, ?, ?)",
                    ("cloud_init", "workflow_start", "github_actions", "approved"))
          conn.commit()
          conn.close()
          print("✅ provenance.db seeded")
          
          # Init perception.db
          from perception.database import init_db
          init_db()
          print("✅ perception.db initialized")
          
          # Init evidence_chain.db
          from perception.evidence_chain import init_chain_db
          init_chain_db()
          print("✅ evidence_chain.db initialized")
          PYEOF
      
      - name: Run Perception + Add to Chain
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import json
          import traceback
          from datetime import datetime
          
          try:
              from perception.layer import perceive
              from perception.evidence_chain import add_observation
              
              result = perceive(save=False)
              chain_result = add_observation(result, terminal="cloud")
              
              timestamp = datetime.now().strftime("%Y%m%d_%H%M")
              filename = f"evidence/perception_{timestamp}.json"
              with open(filename, "w") as f:
                  json.dump({
                      "perception": result,
                      "chain": chain_result
                  }, f, indent=2, default=str)
              
              obs_count = len(result.get('observations', {}))
              print(f"✅ Perception: {obs_count} observations")
              print(f"✅ Chain Block #{chain_result['block_index']}")
              print(f"✅ Block Hash: {chain_result['block_hash'][:16]}...")
          except Exception as e:
              print(f"❌ ERROR: {e}")
              traceback.print_exc()
              raise
          PYEOF
      
      - name: Commit Evidence + Chain
        if: success()
        run: |
          git config user.name "Ember Bot"
          git config user.email "ember@bot.local"
          git add evidence/ perception/*.db 2>/dev/null || git add evidence/
          git diff --staged --quiet || git commit -m "Ember: Chain block $(date +%Y-%m-%d_%H:%M)"
          git push || echo "Push skipped"
