name: Ember Perception + Evidence Chain

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  perceive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install deps
        run: pip install rich cryptography
      
      - name: Initialize databases
        run: |
          python3 -c "from perception.database import init_db; init_db()" || true
          python3 -c "from provenance import init_db; init_db()" || true
          python3 -c "from perception.evidence_chain import init_chain_db; init_chain_db()" || true
      
      - name: Run Perception + Add to Chain
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p evidence
          python3 << 'PYEOF'
          import json
          import traceback
          from datetime import datetime
          from perception.layer import perceive
          from perception.evidence_chain import add_observation
          
          try:
              result = perceive(save=False)
              chain_result = add_observation(result, terminal="cloud")
              
              timestamp = datetime.now().strftime("%Y%m%d_%H%M")
              filename = f"evidence/perception_{timestamp}.json"
              with open(filename, "w") as f:
                  json.dump({
                      "perception": result,
                      "chain": chain_result
                  }, f, indent=2, default=str)
              
              print(f"✅ Perception: {len(result.get('observations', {}))} observations")
              print(f"✅ Chain Block #{chain_result['block_index']}")
              print(f"✅ Block Hash: {chain_result['block_hash'][:16]}...")
          except Exception as e:
              print(f"❌ ERROR: {e}")
              traceback.print_exc()
              raise
          PYEOF
      
      - name: Commit Evidence + Chain
        if: success()
        run: |
          git config user.name "Ember Bot"
          git config user.email "ember@bot.local"
          git add evidence/ perception/evidence_chain.db
          git diff --staged --quiet || git commit -m "Ember: Chain block $(date +%Y-%m-%d_%H:%M)"
          git push || echo "Push skipped"
