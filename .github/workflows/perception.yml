name: Ember Perception (CI — Temp DBs Only)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  perceive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install rich cryptography
      - name: Storage modes (preflight)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 -m py_compile perception/storage.py
          python3 -m perception.storage
      - name: Migration verifier self-test
        run: python3 -m perception.migration_verify
      - name: Upload artifacts (NOT committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perception-artifacts
          path: evidence/
          retention-days: 7
          if-no-files-found: ignore
